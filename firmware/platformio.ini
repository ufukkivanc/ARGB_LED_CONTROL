[platformio]
default_envs = esp32dev
src_dir = src
include_dir = include

[env:esp32dev]
platform = espressif32 @ ^6.9.0
board = esp32doit-devkit-v1
framework = arduino

platform_packages = 
    espressif/toolchain-xtensa-esp32 @ 12.2.0+20230208

monitor_speed = 115200
upload_speed = 921600

build_flags = 
    -D CORE_DEBUG_LEVEL=3
    -D CONFIG_ASYNC_TCP_RUNNING_CORE=0
    -D WS_MAX_QUEUED_MESSAGES=32
    -Wno-attributes

lib_deps = 
    fastled/FastLED @ ^3.9.4
    bblanchon/ArduinoJson @ ^7.3.0
    mathieucarbou/ESPAsyncWebServer @ ^3.6.0
    mathieucarbou/AsyncTCP @ ^3.3.1

lib_ignore = 
    WebServer

board_build.partitions = min_spiffs.csv

; WLED uyumluluk katmanı OLMADAN derleme (ENABLE_WLED_COMPAT=0): /json/*, _wled._tcp ve WLED WebSocket yok.
[env:esp32dev_nowled]
extends = env:esp32dev
build_flags =
    ${env:esp32dev.build_flags}
    -D ENABLE_WLED_COMPAT=0
